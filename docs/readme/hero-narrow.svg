  <title id="title">Agent Control Center</title>
  <desc id="desc">Reliable agents. Deliberate control. A sanitised, simulated portfolio demo by Alberto Reyes Castro. Conceptual control path: task, route, local or cloud execution, separate review, deterministic checks and a closed human gate, with bounded recovery. Not live telemetry.</desc>
