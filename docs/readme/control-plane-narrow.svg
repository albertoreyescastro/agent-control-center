<svg xmlns="http://www.w3.org/2000/svg" width="480" height="960" viewBox="0 0 480 960" role="img" aria-labelledby="title desc"><title id="title">Conceptual task-to-human-gate flow</title><desc id="desc">Task, policy-fenced control plane, eligible local or cloud execution, bounded recovery, separate review, deterministic checks, then a human merge gate.</desc><defs><linearGradient id="wash" x2="1" y2="1"><stop stop-color="#15322b"/><stop offset="1" stop-color="#0a1114"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63eacb"/></marker></defs><rect width="480" height="960" rx="18" fill="#0a1114"/><g font-family="Arial, Helvetica, sans-serif"><text x="24" y="34" fill="#63eacb" font-size="18" font-weight="600">CONCEPTUAL EXECUTION FLOW</text><text x="24" y="64" fill="#afc4c5" font-size="19" font-weight="400">Generic roles · no live topology</text><rect x="72" y="91" width="336" height="79" rx="12" fill="#111d22" stroke="#2d474a"/><text x="92" y="127" fill="#e8f3f1" font-size="24" font-weight="600">Task</text><text x="92" y="156" fill="#afc4c5" font-size="18" font-weight="400">Generic alias</text><path d="M 240 170 V 198" fill="none" stroke="#63eacb" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="188" width="432" height="239" rx="16" fill="none" stroke="#e5bd7b" stroke-dasharray="6 5"/><rect x="48" y="207" width="384" height="94" rx="12" fill="#12362f" stroke="#63eacb"/><text x="68" y="243" fill="#e8f3f1" font-size="24" font-weight="600">Control plane</text><text x="68" y="272" fill="#afc4c5" font-size="18" font-weight="400">Filter → route → fence</text><text x="48" y="335" fill="#afc4c5" font-size="21" font-weight="400">Capability + health + lease</text><text x="48" y="366" fill="#afc4c5" font-size="21" font-weight="400">Quota / pool eligibility</text><text x="48" y="401" fill="#e5bd7b" font-size="19" font-weight="600">POLICY: NO PAID RECOVERY</text><path d="M 240 427 V 450" fill="none" stroke="#63eacb" stroke-width="2" marker-end="url(#arrow)"/><rect x="72" y="451" width="336" height="103" rx="12" fill="#111d22" stroke="#2d474a"/><text x="92" y="487" fill="#e8f3f1" font-size="24" font-weight="600">Local / cloud execution</text><text x="92" y="516" fill="#afc4c5" font-size="18" font-weight="400">Choose an eligible surface</text><text x="92" y="533" fill="#afc4c5" font-size="18" font-weight="400">Fresh owner. Fresh attempt.</text><path d="M 240 554 V 587" fill="none" stroke="#63eacb" stroke-width="2" marker-end="url(#arrow)"/><path d="M 72 500 H 12 V 254 H 46" fill="none" stroke="#63eacb" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 6"/><text x="75" y="581" fill="#63eacb" font-size="17" font-weight="400">Failure → bounded recovery</text><rect x="72" y="590" width="336" height="94" rx="12" fill="#111d22" stroke="#2d474a"/><text x="92" y="626" fill="#e8f3f1" font-size="24" font-weight="600">Independent review</text><text x="92" y="655" fill="#afc4c5" font-size="18" font-weight="400">Separate role · outage fallback</text><path d="M 240 684 V 711" fill="none" stroke="#63eacb" stroke-width="2" marker-end="url(#arrow)"/><rect x="72" y="712" width="336" height="82" rx="12" fill="#111d22" stroke="#2d474a"/><text x="92" y="748" fill="#e8f3f1" font-size="24" font-weight="600">Deterministic checks</text><text x="92" y="777" fill="#afc4c5" font-size="18" font-weight="400">Evidence before promotion</text><path d="M 240 794 V 821" fill="none" stroke="#63eacb" stroke-width="2" marker-end="url(#arrow)"/><rect x="72" y="822" width="336" height="72" rx="12" fill="#12362f" stroke="#63eacb"/><text x="92" y="858" fill="#e8f3f1" font-size="24" font-weight="600">Human merge gate</text><text x="72" y="930" fill="#e5bd7b" font-size="21" font-weight="400">Output ≠ permission to merge</text></g></svg>
