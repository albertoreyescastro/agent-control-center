<svg xmlns="http://www.w3.org/2000/svg" width="960" height="233" viewBox="0 0 960 233" role="img" aria-labelledby="title desc"><title id="title">Private-to-public trust boundary</title><desc id="desc">Conceptual one-way publication: private harness, read-only adapter, fail-closed sanitizer, finite public-state contract and public dashboard. Today the browser only loads demo fixtures.</desc><defs><linearGradient id="wash" x2="1" y2="1"><stop stop-color="#15322b"/><stop offset="1" stop-color="#0a1114"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63eacb"/></marker></defs><rect width="960" height="233" rx="18" fill="#0a1114"/><g font-family="Arial, Helvetica, sans-serif"><text x="26" y="34" fill="#63eacb" font-size="17" font-weight="600">TRUST BOUNDARY / CONCEPTUAL PUBLICATION PATH</text><rect x="26" y="65" width="166" height="100" rx="12" fill="#111d22" stroke="#2d474a"/><text x="38" y="106" fill="#e8f3f1" font-size="17" font-weight="600">Private harness</text><text x="38" y="136" fill="#afc4c5" font-size="15" font-weight="400">Restricted state</text><path d="M 192 114 H 210" fill="none" stroke="#63eacb" stroke-width="2" marker-end="url(#arrow)"/><rect x="212" y="65" width="166" height="100" rx="12" fill="#111d22" stroke="#2d474a"/><text x="224" y="106" fill="#e8f3f1" font-size="17" font-weight="600">Read-only adapter</text><text x="224" y="136" fill="#afc4c5" font-size="15" font-weight="400">Offline extraction</text><path d="M 378 114 H 396" fill="none" stroke="#63eacb" stroke-width="2" marker-end="url(#arrow)"/><rect x="398" y="65" width="166" height="100" rx="12" fill="#12362f" stroke="#63eacb"/><text x="410" y="106" fill="#e8f3f1" font-size="17" font-weight="600">Sanitizer</text><text x="410" y="136" fill="#afc4c5" font-size="15" font-weight="400">Reject unknowns</text><path d="M 564 114 H 582" fill="none" stroke="#63eacb" stroke-width="2" marker-end="url(#arrow)"/><rect x="584" y="65" width="166" height="100" rx="12" fill="#111d22" stroke="#2d474a"/><text x="596" y="106" fill="#e8f3f1" font-size="17" font-weight="600">Public contract</text><text x="596" y="136" fill="#afc4c5" font-size="15" font-weight="400">Finite aliases</text><path d="M 750 114 H 768" fill="none" stroke="#63eacb" stroke-width="2" marker-end="url(#arrow)"/><rect x="770" y="65" width="166" height="100" rx="12" fill="#111d22" stroke="#2d474a"/><text x="782" y="106" fill="#e8f3f1" font-size="17" font-weight="600">Dashboard</text><text x="782" y="136" fill="#afc4c5" font-size="15" font-weight="400">Demo fixtures today</text><text x="26" y="205" fill="#afc4c5" font-size="19" font-weight="400">No adapter is connected to the browser. No reverse control path.</text></g></svg>
