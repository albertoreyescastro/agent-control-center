<svg xmlns="http://www.w3.org/2000/svg" width="480" height="726" viewBox="0 0 480 726" role="img" aria-labelledby="title desc"><title id="title">Private-to-public trust boundary</title><desc id="desc">Read-only extraction, fail-closed sanitization, finite contract, then public presentation. The demo has no live adapter or reverse control path.</desc><defs><linearGradient id="wash" x2="1" y2="1"><stop stop-color="#15322b"/><stop offset="1" stop-color="#0a1114"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63eacb"/></marker></defs><rect width="480" height="726" rx="18" fill="#0a1114"/><g font-family="Arial, Helvetica, sans-serif"><text x="24" y="34" fill="#63eacb" font-size="18" font-weight="600">CONCEPTUAL TRUST BOUNDARY</text><rect x="50" y="64" width="380" height="83" rx="12" fill="#111d22" stroke="#2d474a"/><text x="70" y="100" fill="#e8f3f1" font-size="24" font-weight="600">Private harness</text><text x="70" y="129" fill="#afc4c5" font-size="18" font-weight="400">Restricted state</text><path d="M 240 147 V 175" fill="none" stroke="#63eacb" stroke-width="2" marker-end="url(#arrow)"/><rect x="50" y="177" width="380" height="83" rx="12" fill="#111d22" stroke="#2d474a"/><text x="70" y="213" fill="#e8f3f1" font-size="24" font-weight="600">Read-only adapter</text><text x="70" y="242" fill="#afc4c5" font-size="18" font-weight="400">Offline extraction</text><path d="M 240 260 V 288" fill="none" stroke="#63eacb" stroke-width="2" marker-end="url(#arrow)"/><rect x="50" y="290" width="380" height="83" rx="12" fill="#12362f" stroke="#63eacb"/><text x="70" y="326" fill="#e8f3f1" font-size="24" font-weight="600">Sanitizer</text><text x="70" y="355" fill="#afc4c5" font-size="18" font-weight="400">Reject unknowns</text><path d="M 240 373 V 401" fill="none" stroke="#63eacb" stroke-width="2" marker-end="url(#arrow)"/><rect x="50" y="403" width="380" height="83" rx="12" fill="#111d22" stroke="#2d474a"/><text x="70" y="439" fill="#e8f3f1" font-size="24" font-weight="600">Public contract</text><text x="70" y="468" fill="#afc4c5" font-size="18" font-weight="400">Finite aliases</text><path d="M 240 486 V 514" fill="none" stroke="#63eacb" stroke-width="2" marker-end="url(#arrow)"/><rect x="50" y="516" width="380" height="83" rx="12" fill="#111d22" stroke="#2d474a"/><text x="70" y="552" fill="#e8f3f1" font-size="24" font-weight="600">Dashboard</text><text x="70" y="581" fill="#afc4c5" font-size="18" font-weight="400">Demo fixtures today</text><text x="24" y="663" fill="#afc4c5" font-size="21" font-weight="400">Demo fixtures only. No live adapter.</text><text x="24" y="696" fill="#afc4c5" font-size="21" font-weight="400">No reverse control path.</text></g></svg>
