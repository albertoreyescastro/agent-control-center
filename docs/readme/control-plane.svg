<svg xmlns="http://www.w3.org/2000/svg" width="960" height="690" viewBox="0 0 960 690" role="img" aria-labelledby="title desc"><title id="title">Conceptual control-plane architecture</title><desc id="desc">A generic task passes capability, health, lease and quota eligibility before local or cloud execution. Failure returns through bounded recovery. Separate review and deterministic checks precede a human merge gate.</desc><defs><linearGradient id="wash" x2="1" y2="1"><stop stop-color="#15322b"/><stop offset="1" stop-color="#0a1114"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63eacb"/></marker></defs><rect width="960" height="690" rx="18" fill="#0a1114"/><g font-family="Arial, Helvetica, sans-serif"><text x="28" y="40" fill="#63eacb" font-size="17" font-weight="600">CONTROL PLANE / CONCEPTUAL EXECUTION FLOW</text><text x="28" y="72" fill="#afc4c5" font-size="19" font-weight="400">Generic roles. No live operational topology.</text><rect x="225" y="128" width="272" height="330" rx="16" fill="none" stroke="#e5bd7b" stroke-dasharray="6 5"/><text x="245" y="157" fill="#e5bd7b" font-size="16" font-weight="600">POLICY BOUNDARY</text><rect x="28" y="241" width="166" height="91" rx="12" fill="#111d22" stroke="#2d474a"/><text x="48" y="277" fill="#e8f3f1" font-size="24" font-weight="600">Task</text><text x="48" y="306" fill="#afc4c5" font-size="18" font-weight="400">Generic alias</text><path d="M 194 286 H 248" fill="none" stroke="#63eacb" stroke-width="2" marker-end="url(#arrow)"/><rect x="248" y="183" width="226" height="105" rx="12" fill="#12362f" stroke="#63eacb"/><text x="268" y="219" fill="#e8f3f1" font-size="24" font-weight="600">Control plane</text><text x="268" y="248" fill="#afc4c5" font-size="18" font-weight="400">Eligibility → route</text><text x="268" y="325" fill="#afc4c5" font-size="20" font-weight="400">Capability + health</text><text x="268" y="358" fill="#afc4c5" font-size="20" font-weight="400">Lease + attempt fence</text><text x="268" y="391" fill="#afc4c5" font-size="20" font-weight="400">Quota / pool eligibility</text><text x="268" y="426" fill="#e5bd7b" font-size="20" font-weight="400">No paid recovery</text><rect x="550" y="128" width="382" height="87" rx="12" fill="#111d22" stroke="#2d474a"/><text x="570" y="164" fill="#e8f3f1" font-size="24" font-weight="600">Local execution</text><text x="570" y="193" fill="#afc4c5" font-size="18" font-weight="400">Eligible code capability</text><rect x="550" y="243" width="382" height="87" rx="12" fill="#111d22" stroke="#2d474a"/><text x="570" y="279" fill="#e8f3f1" font-size="24" font-weight="600">Cloud / hybrid execution</text><text x="570" y="308" fill="#afc4c5" font-size="18" font-weight="400">Alternative eligible surface</text><path d="M 474 222 H 514 V 172 H 549" fill="none" stroke="#63eacb" stroke-width="2" marker-end="url(#arrow)"/><path d="M 514 222 V 287 H 549" fill="none" stroke="#63eacb" stroke-width="2" marker-end="url(#arrow)"/><path d="M 932 172 H 947 V 347 H 742 V 367" fill="none" stroke="#63eacb" stroke-width="2" marker-end="url(#arrow)"/><path d="M 742 330 V 367" fill="none" stroke="#63eacb" stroke-width="2" marker-end="url(#arrow)"/><rect x="550" y="368" width="382" height="90" rx="12" fill="#111d22" stroke="#2d474a"/><text x="570" y="404" fill="#e8f3f1" font-size="24" font-weight="600">Independent review</text><text x="570" y="433" fill="#afc4c5" font-size="18" font-weight="400">Separate role · alternate on outage</text><path d="M 742 458 V 481" fill="none" stroke="#63eacb" stroke-width="2" marker-end="url(#arrow)"/><rect x="550" y="482" width="382" height="78" rx="12" fill="#111d22" stroke="#2d474a"/><text x="570" y="518" fill="#e8f3f1" font-size="24" font-weight="600">Deterministic checks</text><text x="570" y="547" fill="#afc4c5" font-size="18" font-weight="400">Evidence before promotion</text><path d="M 742 560 V 583" fill="none" stroke="#63eacb" stroke-width="2" marker-end="url(#arrow)"/><rect x="550" y="584" width="382" height="63" rx="12" fill="#12362f" stroke="#63eacb"/><text x="570" y="620" fill="#e8f3f1" font-size="24" font-weight="600">Human merge gate</text><text x="28" y="527" fill="#e8f3f1" font-size="23" font-weight="600">Bounded recovery</text><text x="28" y="558" fill="#afc4c5" font-size="18" font-weight="400">Fresh attempt. Preserve the ceiling.</text><text x="28" y="590" fill="#afc4c5" font-size="18" font-weight="400">Stale results cannot own newer work.</text><path d="M 550 287 H 525 V 490 H 361 V 459" fill="none" stroke="#63eacb" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 6"/><text x="550" y="666" fill="#e5bd7b" font-size="16" font-weight="400">Output ≠ permission to merge</text></g></svg>
